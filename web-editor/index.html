<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Config Editor for KProbe</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="config.js"></script>
    <script src="modals.js" defer></script>
    <script src='https://cdn.jsdelivr.net/gh/K-cermak/Enplated-Framework@enp-v3/enp-loader.min.js'></script>
    <style>
        tbody td {
            vertical-align: middle;
        }
    </style>
</head>
<body class="d-flex flex-column h-100">
    <header>
        <div class="d-flex mt-3 justify-content-center align-items-center mt-4">
            <h1 class="mt-0 text-center">Config Editor for KProbe</h1>
            <a href="https://github.com/K-cermak/KProbe" target="_blank" class="btn btn-secondary ms-4 me-2"><i class="bi bi-github"></i> GitHub</a>
            <a href="https://github.com/K-cermak/KProbe/blob/main/FAQ.md" target="_blank" class="btn btn-primary mx-2"><i class="bi bi-book"></i> Documentation</a>
        </div>
    </header>

    <main class="flex-shrink-0">
        <div class="d-flex justify-content-center mt-5 mb-4">
            <label class="btn btn-secondary mx-2"><i class="bi bi-upload"></i> Load Config
                <input class="form-control form-control-sm d-none" type="file" accept=".conf" id="uploadConfig">
            </label>

            <button class="btn btn-primary mx-2" id="downloadConfig"><i class="bi bi-download"></i> Download Config</button>
            <span class="mx-2 d-flex align-items-center" id="validationStatus"></span>
        </div>

        <div class="alert alert-warning container d-none" id="errorArea" role="alert">
            <h4 class="alert-heading"><i class="bi bi-exclamation-circle me-2"></i> Errors:</h4>
            <ul id="errorList"></ul>
        </div>

        <table class="table container" id="config">
            <thead>
                <tr>
                    <th scope="col"></th>
                    <th scope="col">
                        Name
                        <span class="d-inline-block" tabindex="0" data-bs-toggle="popover" data-bs-trigger="hover focus" data-bs-content="The name of the scan. Lower case letters, numbers or underscores only. Must be unique.">
                            <i class="bi bi-question-circle"></i>
                        </span>
                    </th>
                    <th scope="col">
                        Type
                        <span class="d-inline-block" tabindex="0" data-bs-toggle="popover" data-bs-trigger="hover focus" data-bs-content="Ping – ICMP ping, HTTP – HTTP/HTTPS request.">
                            <i class="bi bi-question-circle"></i>
                        </span>
                    </th>
                    <th scope="col">
                        Address
                        <span class="d-inline-block" tabindex="0" data-bs-toggle="popover" data-bs-trigger="hover focus" data-bs-content="Address for scan. Supports domain names, IPv4 and IPv6.">
                            <i class="bi bi-question-circle"></i>
                        </span>
                    </th>
                    <th scope="col">
                        Timeout
                        <span class="d-inline-block" tabindex="0" data-bs-toggle="popover" data-bs-trigger="hover focus" data-bs-content="Timeout in ms. If exceeded, the scan is aborted and the service is declared as unavailable. Only integer range 0-30000. 0 means unlimited (not recommended).">
                            <i class="bi bi-question-circle"></i>
                        </span></th>
                    <th scope="col">Status Codes
                        <span class="d-inline-block" tabindex="0" data-bs-toggle="popover" data-bs-trigger="hover focus" data-bs-content="Comma separated list of status codes that are considered as successful. Left empty to accept all status codes.">
                            <i class="bi bi-question-circle"></i>
                        </span>
                    </th>
                    <th scope="col">Expression
                        <span class="d-inline-block" tabindex="0" data-bs-toggle="popover" data-bs-trigger="hover focus" data-bs-content="Logical expression with variables to validate the HTTP response. Click Edit button to configure.">
                            <i class="bi bi-question-circle"></i>
                        </span>
                    </th>
                    <th scope="col"></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="d-flex justify-content-center mt-3 mb-4">
            <button class="btn btn-primary mx-2" id="addRow"><i class="bi bi-plus"></i> Add Row</button>
        </div>

        <!-- Expression Editor Modal -->
        <div class="modal fade" id="expressionModal" tabindex="-1" aria-labelledby="expressionModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="expressionModalLabel">
                            <i class="bi bi-braces me-2"></i>Expression Editor
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <h6 class="mb-3">
                            <i class="bi bi-puzzle me-1"></i>Variables
                            <span class="d-inline-block" tabindex="0" data-bs-toggle="popover" data-bs-trigger="hover focus" data-bs-content="Define variables from the HTTP response. Bool mode checks if a value exists. JSON mode extracts values via JSON path – as bool (existence check) or as number (for comparisons).">
                                <i class="bi bi-question-circle"></i>
                            </span>
                        </h6>
                        <div id="variablesContainer"></div>
                        <button class="btn btn-sm btn-outline-primary mt-2" id="addVariableBtn">
                            <i class="bi bi-plus-lg me-1"></i>Add Variable
                        </button>

                        <hr>

                        <h6 class="mb-3">
                            <i class="bi bi-code-slash me-1"></i>Expression
                            <span class="d-inline-block" tabindex="0" data-bs-toggle="popover" data-bs-trigger="hover focus" data-bs-content="Logical expression using your variables. Allowed: && (and), || (or), ! (not), parentheses, comparison operators (>, <, >=, <=, ==, !=), and number literals.">
                                <i class="bi bi-question-circle"></i>
                            </span>
                        </h6>
                        <input type="text" class="form-control" id="expressionInput" placeholder="e.g. (temp_ok && temp > 15 && temp < 40)">

                        <div id="expressionPreview" class="mt-3"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" id="saveExpressionBtn"><i class="bi bi-check-lg me-1"></i>Save & Close</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer mt-auto py-3 px-4 d-flex flex-column flex-md-row justify-content-between align-items-center" style="background-color: #0d131f;">
        <p class="text-muted m-0">© 2026 <a href="https://karlosoft.com/" target="_blank">Karel Čermák | Karlosoft</a></p>
        <p class="text-muted m-0 mt-2 mt-md-0">Config Editor v2.0., compatible with <a href="https://github.com/K-cermak/KProbe" target="_blank">KProbe v2.0</a></p>
    </footer>

    <script src="script.js" defer></script>
</body>
</html>
