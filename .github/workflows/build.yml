name: Build Packages

on:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set dynamic version
        run: echo "VERSION=2.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build Go binaries
        run: |
          mkdir -p bin
          cd api && GOOS=linux GOARCH=amd64 go build -o ../bin/api-server
          cd ../cli && GOOS=linux GOARCH=amd64 go build -o ../bin/cli

      - name: Build DEB package
        uses: goreleaser/nfpm-action@v2
        with:
          target: deb
          packager: deb
        env:
          VERSION: ${{ env.VERSION }}

      - name: Build RPM package
        uses: goreleaser/nfpm-action@v2
        with:
          target: rpm
          packager: rpm
        env:
          VERSION: ${{ env.VERSION }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kprobe-${{ github.ref_name }}-packages
          path: |
            *.deb
            *.rpm
