name: Build Packages

on:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set dynamic version
        run: |
          FILE_VER=$(cat VERSION | xargs)
          BRANCH_NAME="${{ github.ref_name }}"
          echo "VERSION=${BRANCH_NAME}_${FILE_VER}" >> $GITHUB_ENV

      - name: Build Go binaries
        run: |
          mkdir -p bin
          
          cd api && GOOS=linux GOARCH=amd64 go build -o ../bin/api-server
          
          cd ../cli
          MODULE_NAME=$(go list -m)
          GOOS=linux GOARCH=amd64 go build -ldflags "-X '${MODULE_NAME}/cmd.Version=${{ env.VERSION }}'" -o ../bin/cli

      - name: Install nFPM
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build DEB package
        run: nfpm pkg --packager deb --target .
        env:
          VERSION: ${{ env.VERSION }}

      - name: Build RPM package
        run: nfpm pkg --packager rpm --target .
        env:
          VERSION: ${{ env.VERSION }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kprobe-${{ github.ref_name }}-packages
          path: |
            *.deb
            *.rpm
